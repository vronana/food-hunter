<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#f7f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘 뭐먹지">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:type" content="website">
<meta property="og:site_name" content="오늘 뭐먹지">
<meta property="og:title" content="오늘 뭐먹지">
<meta property="og:description" content="오늘 뭐 먹지? 고민되면 뽑기로 정해 보세요.">
<meta property="og:url" content="https://vronana.github.io/food-hunter/suji/">
<meta property="og:image" content="https://vronana.github.io/food-hunter/icons/icon-512.png?v=22">
<meta property="og:locale" content="ko_KR">
<meta name="description" content="오늘 뭐 먹지? 고민되면 뽑기로 정해 보세요.">
<link rel="manifest" href="manifest.webmanifest?v=23">
<link rel="icon" type="image/png" href="../icons/icon-192.png?v=22">
<link rel="apple-touch-icon" href="../icons/icon-180.png?v=22">
<title>오늘 뭐먹지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* Layout: quiet Apple-style screens in warm neutrals. Home = date, big question, search, white category cards. List = grouped inset lists by neighborhood. One accent color, one typeface (Jua). One light theme on purpose. */
:root{
  --bg:#f7f5f2; --paper:#ffffff; --ink:#2b2622; --muted:#8b8279; --line:#eee9e3; --fill:#efebe5;
  --accent:#d9622b; --accent-soft:#fdeee4; --accent-fg:#ffffff; --danger:#c8403a;
  --shadow:0 1px 2px rgba(70,50,30,.05),0 6px 20px rgba(70,50,30,.06);
  --font:"Jua","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:only light;
}
*{box-sizing:border-box}
html{font-synthesis:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,b,strong{font-weight:400}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
button,select,input{font:inherit;font-weight:400}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;padding:8px 16px;min-height:52px;background:rgba(247,245,242,.85);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);display:flex;align-items:center;gap:10px}
.back{border:0;background:none;color:var(--accent);font-size:1.05rem;cursor:pointer;padding:6px 6px 6px 0;display:flex;align-items:center;gap:4px}
.back::before{content:"";width:9px;height:9px;border-left:2.2px solid currentColor;border-bottom:2.2px solid currentColor;transform:rotate(45deg);margin-right:3px}
.spacer{flex:1}
.save{font-size:.85rem;color:var(--muted);white-space:nowrap}
.save.err{color:var(--danger)}
.editbtn{border:0;border-radius:999px;background:var(--fill);color:var(--ink);font-size:.92rem;padding:7px 15px;cursor:pointer}
.editbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tbtn{border:0;background:none;color:var(--muted);display:inline-flex;align-items:center;gap:4px;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:.9rem}
.tbtn:hover{background:var(--fill);color:var(--ink)}
.tbtn .ic{--s:22px}
.ic{display:inline-flex;width:var(--s,44px);height:var(--s,44px);flex:none}
.ic svg{width:100%;height:100%}
.ic.line{color:var(--muted)}
.lhead{display:flex;align-items:center;gap:12px}

.top.slim{min-height:0;padding-block:0;height:0;overflow:visible}
.hero{padding-block:18px 4px;position:relative}
.region{position:absolute;right:2px;top:20px;font-size:.92rem;color:var(--muted);background:var(--fill);padding:5px 12px;border-radius:999px}
.top.slim + * .hero, .top.slim ~ * .hero{padding-block:max(18px,env(safe-area-inset-top,0px)) 4px}
.eyebrow{margin:0 0 8px;color:var(--muted);font-size:1rem}
h1{font-size:2.6rem;line-height:1.18;letter-spacing:-.01em;margin:0;text-wrap:balance}
.mark{color:var(--accent)}
.hero h1{line-height:1}
.hero .sub{margin-top:0;line-height:1.1}
.sub{margin:10px 0 0;color:var(--muted);font-size:1rem}
.search{position:relative;margin-block:22px 4px}
.search input{width:100%;border:0;background:var(--fill);color:var(--ink);font-size:1.05rem;padding:14px 16px 14px 44px;border-radius:14px}
.search input::placeholder{color:var(--muted)}
.search::before{content:"";position:absolute;left:17px;top:50%;width:11px;height:11px;border:2px solid var(--muted);border-radius:50%;transform:translateY(-62%)}
.search::after{content:"";position:absolute;left:27px;top:calc(50% + 5px);width:7px;height:2px;background:var(--muted);transform:rotate(45deg);border-radius:2px}

.lab{margin:34px 0 12px;padding-inline:4px;font-size:.95rem;color:var(--muted)}
.lab:empty{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cc{border:0;text-align:left;background:var(--paper);color:var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:20px 18px 18px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:transform .15s}
.cc:hover{transform:translateY(-2px)}
.cc:active{transform:scale(.98)}
.cc .ic{margin-bottom:10px}
.cn{font-size:1.4rem;line-height:1.25}
.cm{font-size:.95rem;color:var(--muted)}
.sc{border:0;text-align:left;background:var(--paper);color:var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.trashlink{margin-top:26px;width:100%}
.addbtn{width:100%;margin-top:14px;border:2px dashed #e3cdb4;background:transparent;color:var(--accent);border-radius:16px;padding:13px;font:inherit;font-size:1.02rem;cursor:pointer}
.addform{margin-top:12px;background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:grid;gap:10px}
.addform input[type=text],.addform select{width:100%;border:0;background:var(--fill);color:var(--ink);font:inherit;font-size:1.02rem;padding:12px 14px;border-radius:12px}
.addform .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addform .chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:1rem}
.addform .chk input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border:2px solid #cdbfb2;border-radius:7px;background:#fff;display:grid;place-content:center;cursor:pointer;flex:none}
.addform .chk input::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.addform .chk input:checked{background:var(--accent);border-color:var(--accent)}
.addform .chk input:checked::after{opacity:1}
.addform .pbtn{padding:12px;border-radius:12px}
.yrcard{width:100%;margin-top:12px}
.yrcard+.card{margin-top:8px}
.sc .ic{grid-row:1/3}
.sc .scl{font-size:1.05rem;align-self:end}
.sc .scn{align-self:start;color:var(--muted);font-size:.95rem}
.todo{margin-top:30px;border-radius:20px;background:var(--paper);box-shadow:var(--shadow);padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.todo p{margin:0;font-size:1.1rem}
.todo small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.todo button{border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent);padding:9px 18px;cursor:pointer}
.link{margin-top:24px;border:0;background:none;color:var(--muted);font-size:.92rem;cursor:pointer;padding:6px 4px}
.link:hover{color:var(--ink)}

.lh{padding-block:20px 0}
.lh h1{font-size:2.4rem}
.lh .sub{margin-top:6px}
.pills{display:flex;flex-wrap:nowrap;gap:6px;margin-block:16px 2px}
.pills .selw{flex:1 1 0;min-width:0;display:block}
.pills select.pill{width:100%;text-overflow:ellipsis;font-size:.9rem;padding:8px 22px 8px 11px}
.pills .selw::after{right:10px}
@media (max-width:360px){.pills{gap:4px}.pills select.pill{font-size:.8rem;padding:8px 16px 8px 8px}.pills .selw::after{right:6px}}
.selw{position:relative;display:inline-block}
.selw::after{content:"";position:absolute;right:13px;top:50%;width:5px;height:5px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;color:var(--muted)}
.pill{appearance:none;-webkit-appearance:none;border:0;background:var(--fill);color:var(--ink);font-size:.95rem;padding:8px 32px 8px 15px;border-radius:999px;cursor:pointer}
button.pill{padding:8px 15px}
button.pill[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.banner{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--fill);color:var(--muted);font-size:.95rem}
.notice{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--fill);color:var(--muted);font-size:.95rem}

.cap{margin:26px 0 8px;padding-inline:6px;display:flex;align-items:baseline;gap:8px;color:var(--muted);font-size:.95rem}
.cap b{color:var(--ink)}
.card{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"star info ctl" ". panel panel";gap:4px 8px;align-items:center;padding:13px 14px 13px 6px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.star{grid-area:star;font-size:1.3rem;line-height:1;border:0;background:none;color:#ddd6cd;cursor:pointer;padding:8px;border-radius:8px}
.star[aria-pressed="true"]{color:var(--accent)}
.star:hover{color:var(--accent)}
.star:disabled{cursor:default}
.info{grid-area:info;min-width:0}
.nm{font-size:1.08rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px;overflow-wrap:anywhere}
.badge{font-size:.75rem;color:var(--accent);background:var(--accent-soft);padding:1px 9px;border-radius:999px;white-space:nowrap}
.tag{font-size:.75rem;color:var(--muted);background:var(--fill);padding:1px 9px;border-radius:999px;white-space:nowrap}
.meta,.menu{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.info.tap{cursor:pointer;border-radius:10px}
.item.open{background:var(--fill)}
.panel{grid-area:panel;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0 4px}
.pbtn{font-size:.92rem;border:0;border-radius:999px;background:var(--paper);color:var(--ink);padding:7px 15px;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.pbtn.main{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.pbtn.del{color:var(--danger);margin-left:0}
.pbtn.del.armed{background:var(--danger);color:#fff}
.pbtn:disabled{opacity:.5;cursor:default}
.ctl{grid-area:ctl;display:flex;align-items:center;gap:6px}
.cat{appearance:none;-webkit-appearance:none;font-size:.92rem;border:0;background:var(--fill);color:var(--ink);padding:7px 28px 7px 13px;border-radius:999px;cursor:pointer;max-width:9.5em}
.cat:disabled{cursor:default;opacity:.7}
.ctl .selw::after{right:11px}
.map{font-size:.88rem;color:var(--accent);text-decoration:none;padding:6px;white-space:nowrap}
.map:hover{text-decoration:underline}
.del,.restore{font-size:.88rem;border:0;background:none;cursor:pointer;padding:6px;border-radius:8px;white-space:nowrap}
.del{color:var(--danger);margin-left:8px}
.del.armed{background:var(--danger);color:#fff;padding-inline:10px}
.restore{color:var(--accent)}
.del:disabled,.restore:disabled{opacity:.5;cursor:default}
.backupw{margin-top:34px;text-align:center}
.backup{border:0;background:none;color:var(--muted);font-size:.9rem;padding:8px 14px;border-radius:999px;cursor:pointer}
.backup:hover{background:var(--fill);color:var(--ink)}
.badge.chain{color:#4a63c9;background:#e8edff}
.badge.link{color:#b4580f;background:#ffe9d2}
.pickbtn{margin-top:16px;width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--accent-fg);font-size:1.15rem;padding:15px 18px;cursor:pointer;box-shadow:0 6px 18px rgba(217,98,43,.22)}
.pickbtn.rich{padding:14px 14px 13px;text-align:center}
.pb-chars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;max-width:340px;margin:0 auto 10px}
.pb-chars.one{grid-template-columns:1fr;max-width:44px}
.pb-ch{display:flex;justify-content:center;min-width:0;animation:bob 1.6s ease-in-out infinite;animation-delay:var(--d,0s)}
.pb-ch .ic{width:100%;height:auto;aspect-ratio:1;max-width:38px;background:rgba(255,255,255,.92);border-radius:50%;padding:2px;box-sizing:border-box}
.pb-main{font-size:1.7rem;line-height:1.25;display:flex;align-items:center;justify-content:center;gap:10px}
.dice{display:inline-block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.pb-ch{animation:none}}
.listpick{margin-top:6px;margin-bottom:4px}
.pickbtn:active{transform:scale(.98)}
.pickov{position:fixed;inset:0;z-index:40;background:rgba(43,38,34,.35);display:flex;align-items:flex-end;justify-content:center}
.picksheet{width:100%;max-width:560px;background:var(--paper);border-radius:26px 26px 0 0;padding:26px 22px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(43,38,34,.18)}
.pk-top{display:flex;align-items:center;gap:12px;margin-bottom:6px;min-height:64px}
.pk-ico{flex:none}
.pk-chars{display:flex;justify-content:space-between;gap:2px;margin:0 0 12px}
.pk-ch{flex:1;display:flex;justify-content:center;opacity:.4;transform:scale(.88);transition:opacity .08s,transform .08s}
.pk-ch.on{opacity:1;transform:scale(1.3)}
.pk-ch .ic{--s:34px}
@media (max-width:380px){.pk-ch .ic{--s:28px}}
@media (prefers-reduced-motion:reduce){.pk-ch{transition:none}}
.pk-hint{color:var(--muted);text-align:center;padding:14px 0 18px;font-size:1rem}
.pk-more{animation:fadeup .35s ease both}
.pk-name.tick{animation:tick .09s ease-out}
.pk-name.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes tick{from{opacity:.4;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pk-name.tick,.pk-name.pop,.pk-more{animation:none}}
.pk-top .ic{--s:56px}
.pk-name{font-size:1.7rem;line-height:1.25;overflow-wrap:anywhere}
.pk-meta{color:var(--muted);font-size:.95rem;margin:2px 0}
.pk-tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.pk-act{display:flex;gap:10px;margin-top:20px}
.pk-act a,.pk-act button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:14px;font-size:1.05rem;padding:13px 10px;cursor:pointer}
.pk-map{background:var(--accent);color:var(--accent-fg)}
.pk-again{background:var(--accent-soft);color:var(--accent)}
.pk-close{display:block;width:100%;margin-top:10px;border:0;background:none;color:var(--muted);padding:10px;font-size:.95rem;cursor:pointer}
.ver{margin:0;padding:10px 0 34px;text-align:center;color:var(--muted);font-size:.8rem}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:#fff;padding:11px 14px 11px 18px;border-radius:999px;box-shadow:0 8px 28px rgba(43,38,34,.25);display:flex;gap:14px;align-items:center;font-size:.95rem;width:max-content;max-width:calc(100vw - 32px)}
.toast button{white-space:nowrap;flex:none;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:5px 13px;cursor:pointer}
footer{margin-top:44px;color:var(--muted);font-size:.85rem;max-width:60ch}
@media (max-width:560px){
  h1{font-size:2.15rem}
  .lh h1{font-size:2rem}
}
@media (prefers-reduced-motion:reduce){.cc{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <button type="button" class="back" id="back" hidden>홈</button>
    <span class="spacer"></span>
    <span class="save" id="save" aria-live="polite"></span>
    <button type="button" class="tbtn" id="trashbtn" aria-label="삭제함" title="삭제함" hidden><span id="trashic" class="ic"></span><span id="trashn"></span></button>
  </div>

  <section id="home">
    <div class="hero">
      <span class="region">수지구</span>
      <p class="eyebrow" id="eyebrow"></p>
      <h1>오늘 <span class="mark">뭐먹지?</span></h1>
      <p class="sub" id="sub"></p>
      <button type="button" class="pickbtn rich" id="pickhome" aria-label="오늘 뭐 먹을지 뽑기"></button>
      <div class="search"><input id="q" type="search" placeholder="가게 이름·동네·음식 검색" autocomplete="off" enterkeyhint="search" aria-label="가게 검색"></div>
    </div>
    <div id="homebody"></div>
  </section>

  <section id="listview" hidden>
    <div class="lh"><div class="lhead"><span id="lic"></span><h1 id="lt"></h1></div><p class="sub" id="ls"></p></div>
    <p class="banner" id="banner" hidden></p>
    <p class="notice" id="notice" hidden></p>
    <button type="button" class="pickbtn rich listpick" id="pickbtn2"></button>
    <div class="pills" id="pills">
      <span class="selw"><select class="pill" id="dongsel" aria-label="동네"></select></span>
      <span class="selw"><select class="pill" id="kindsel" aria-label="가게 종류"></select></span>
      <span class="selw"><select class="pill" id="sortsel" aria-label="정렬">
        <option value="name">이름순</option><option value="old">오래된 순</option><option value="big">넓은 순</option>
      </select></span>
    </div>
    <button type="button" class="addbtn" id="addbtn" hidden>+ 가게 직접 추가</button>
    <form class="addform" id="addform" hidden autocomplete="off">
      <input id="an" type="text" maxlength="60" placeholder="가게 이름 (필수)" aria-label="가게 이름">
      <div class="two">
        <select id="adg" aria-label="동네"></select>
        <select id="asel" aria-label="카테고리"></select>
      </div>
      <input id="aa" type="text" maxlength="120" placeholder="주소 (선택) 예: 포은대로 536" aria-label="주소">
      <label class="chk"><input id="ag" type="checkbox"> 모범음식점이에요</label>
      <label class="chk"><input id="astar" type="checkbox"> ★ 즐겨찾기로 추가</label>
      <div class="two"><button type="submit" class="pbtn main">추가</button><button type="button" class="pbtn" id="acancel">닫기</button></div>
    </form>
    <div id="listbody"></div>
  </section>
</div>

<div class="pickov" id="pickov" hidden><div class="picksheet" role="dialog" aria-modal="true" aria-label="뽑기 결과"><div id="pickbody"></div></div></div>

    const tb=h("button",{className:"sc trashlink",type:"button"},icon("trash",30),h("span",{className:"scl",text:"삭제함"}),h("span",{className:"scn",text:tn+"곳"}));
    tb.addEventListener("click",()=>go("list","trash")); frag.append(tb);
  }
  $("listbody").replaceChildren(frag);
}

function paintTop(tc){
  $("back").hidden=S.view!=="list"; slimTop();
  const tb=$("trashbtn");
  tb.hidden=true;
  $("trashn").textContent=tc>0?tc:"";
}
function render(){
  const y=window.scrollY;
  const all=allItems();
  paintTop(all.filter(i=>i.x).length);
  if(S.view==="home") renderHome(all); else renderList(all);
  paintSave();
  if(window.scrollY!==y) window.scrollTo(0,y);
}
function go(view,key){
  S.view=view; S.key=key||null; S.dong="all"; S.kind="all"; S.open=null; FOLDOPEN.clear();
  $("home").hidden=view!=="home"; $("listview").hidden=view!=="list";
  render(); window.scrollTo(0,0);
}

/* ---------- pick ---------- */
const dice=()=>h("span",{className:"dice","aria-hidden":"true",text:"🎲"});
function fillHomePick(){
  const b=$("pickhome"); const row=h("div",{className:"pb-chars","aria-hidden":"true"});
  ["육류","탕류","밥류","면류","중식","일식","양식","세계음식"].forEach((k,i)=>{ const s=h("span",{className:"pb-ch"}); s.style.setProperty("--d",(i*0.12)+"s"); s.append(icon(k,30)); row.append(s); });
  b.replaceChildren(row,h("div",{className:"pb-main"},"랜덤뽑기"));
}
function fillListPick(key,title){
  const b=$("pickbtn2"); if(b.dataset.key===key && b.firstChild) return; b.dataset.key=key;
  const row=h("div",{className:"pb-chars one","aria-hidden":"true"}); const s=h("span",{className:"pb-ch"}); s.append(icon(key,30)); row.append(s);
  b.replaceChildren(row,h("div",{className:"pb-main"},"랜덤뽑기"));
}
let pickTimer=null, pickLast=null;
function stopPick(){ clearTimeout(pickTimer); pickTimer=null; }
function pickFrom(pool){
  const ov$=$("pickov"), body=$("pickbody");
  stopPick();
  if(!pool.length){ showToast("뽑을 가게가 없어요", null); return; }
  let fin=pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1) while(pickLast && fin.r.id===pickLast) fin=pool[Math.floor(Math.random()*pool.length)];
  pickLast=fin.r.id;
  const quick=window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const icoBox=h("div",{className:"pk-ico"}), nameEl=h("div",{className:"pk-name"}), hint=h("div",{className:"pk-hint",text:"두구두구…"});
  const chars=h("div",{className:"pk-chars","aria-hidden":"true"});
  ["육류","탕류","밥류","면류","중식","일식","양식","세계음식"].forEach(k=>{ const s=h("span",{className:"pk-ch"}); s.dataset.k=k; s.append(icon(k,34)); chars.append(s); });
  const light=k=>chars.querySelectorAll(".pk-ch").forEach(s=>s.classList.toggle("on",s.dataset.k===k));
  const showItem=(it,cls)=>{ icoBox.replaceChildren(icon(it.s,56)); nameEl.textContent=it.r.n; nameEl.className="pk-name"+(cls?" "+cls:""); void nameEl.offsetWidth; light(it.s); };
  const close=h("button",{className:"pk-close",type:"button",text:"닫기"});
  close.addEventListener("click",()=>{ stopPick(); ov$.hidden=true; });
  const reveal=()=>{
    const r=fin.r, it=fin;
    showItem(it,"pop"); hint.remove(); chars.remove();
    const tg=h("div",{className:"pk-tags"});
    const t1=h("span",{className:"tag",text:label(it.s)}); paint(t1,it.s); tg.append(t1);
    if(SHOW_G && r.g) tg.append(h("span",{className:"badge",text:"모범"}));
    if(it.c) tg.append(h("span",{className:"badge chain",text:"체인"}));
    if(it.star) tg.append(h("span",{className:"badge",text:"★ 즐겨찾기"}));
    const again=h("button",{className:"pk-again",type:"button",text:"🎲 다시 뽑기"});
    again.addEventListener("click",()=>pickFrom(pool));
    const more=h("div",{className:"pk-more"},tg,
      h("div",{className:"pk-meta",text:r.dg+" · "+r.a}),
      h("div",{className:"pk-meta",text:(r.d?Math.round(r.m)+"㎡ · "+r.d.slice(0,4)+"년 허가":"직접 추가한 가게")+((SHOW_G&&r.g&&r.f)?" · 주메뉴 "+r.f:"")}),
      h("div",{className:"pk-act"},h("a",{className:"pk-map",href:mapUrl(r),target:"_blank",rel:"noopener",text:"지도 보기"}),again));
    body.replaceChildren(h("div",{className:"pk-top"},icoBox,nameEl),more,close);
  };
  body.replaceChildren(h("div",{className:"pk-top"},icoBox,nameEl),hint,chars,close);
  ov$.hidden=false;
  if(quick||pool.length<2){ reveal(); return; }
  let delay=50, elapsed=0, prev=null;
  const step=()=>{
    if(delay>=620){ reveal(); return; }
    let it=pool[Math.floor(Math.random()*pool.length)];
    if(it.r.id===prev) it=pool[(pool.indexOf(it)+1)%pool.length];
    prev=it.r.id; showItem(it,"tick");
    elapsed+=delay; delay=Math.round(delay*1.17);
    pickTimer=setTimeout(step,delay);
  };
  step();
}
$("pickov").addEventListener("click",e=>{ if(e.target===$("pickov")){ stopPick(); $("pickov").hidden=true; } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ stopPick(); $("pickov").hidden=true; } });
fillHomePick();
$("pickhome").addEventListener("click",()=>pickFrom(allItems().filter(i=>!i.x&&!i.h)));
$("pickbtn2").addEventListener("click",()=>{
  const key=S.key; let base=itemsFor(key,allItems());
  if(S.kind==="g") base=base.filter(i=>i.r.g); else if(S.kind==="c") base=base.filter(i=>i.c);
  base=base.filter(i=>S.dong==="all"||i.r.dg===S.dong); if(key==="hold"||key==="trash") base=[];
  pickFrom(base);
});

/* ---------- toast ---------- */
let toastTimer=null, undoFn=null;
function showToast(msg, undo){
  $("toastmsg").textContent=msg; undoFn=undo; $("undo").hidden=!undo; $("toast").hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{$("toast").hidden=true;},6500);
}
$("undo").addEventListener("click",()=>{ const f=undoFn; $("toast").hidden=true; undoFn=null; if(f) f(); });

/* ---------- wiring ---------- */
$("trashic").innerHTML=TRASH_SVG;
$("trashbtn").addEventListener("click",()=>go("list","trash"));
$("back").addEventListener("click",()=>{ if(S.view==="list" && S.key==="trash") go("list","hold"); else go("home"); });

$("dongsel").addEventListener("change",e=>{ S.dong=e.target.value; render(); });
$("sortsel").addEventListener("change",e=>{ S.sort=e.target.value; render(); });
$("kindsel").addEventListener("change",e=>{ S.kind=e.target.value; render(); });
$("ag").parentNode.hidden=!SHOW_G;
$("adg").replaceChildren(h("option",{value:"",text:"동네 고르기"}),...DONGS.map(d=>h("option",{value:d,text:d})));
$("asel").replaceChildren(h("option",{value:"",text:"자동 분류"}),...CATS.filter(c=>c.k!=="기타").map(c=>h("option",{value:c.k,text:c.label||c.k})),h("option",{value:"기타",text:"보류함에 넣기"}));
$("asel").value="";
$("addbtn").addEventListener("click",()=>{ S.adding=true; render(); setTimeout(()=>$("an").focus(),50); });
$("acancel").addEventListener("click",()=>{ S.adding=false; render(); });
$("addform").addEventListener("submit",e=>{
  e.preventDefault();
  const n=$("an").value.trim(), dg=$("adg").value, a=$("aa").value.trim(), g=$("ag").checked;
  let sc=$("asel").value, auto=false;
  if(!sc){ auto=true; sc=autoCat(n)||"기타"; }
  if(!n){ showToast("가게 이름을 적어 주세요.",null); $("an").focus(); return; }
  if(!dg){ showToast("동네를 골라 주세요.",null); return; }
  const id="m-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const nr={id,n,a,dg,m:0,d:"",s:sc,g:g?1:0,f:"",manual:1};
  DATA.push(nr); byId.set(id,nr);
  const next={s:sc,star:$("astar").checked,x:false,h:sc==="기타",c:chain0(nr)};
  ov.set(id,next);
  $("an").value=""; $("aa").value=""; $("ag").checked=false; $("astar").checked=false;
  render();
  const where=sc==="기타"?(auto?"자동 분류가 안 돼서 보류함에":"보류함에"):(auto?label(sc)+"(으)로 자동 분류해서":label(sc)+"에");
  showToast("‘"+n+"’을(를) "+where+" 추가했어요", ()=>commit(id,Object.assign({},next,{x:true}),next));
  if(!db) return;
  pending++; paintSave();
  db.doc("edits/"+id).set(payload(nr,next)).then(()=>{ pending--; lastSaved=new Date(); saveErr=false; paintSave(); }).catch(()=>{
    pending--; saveErr=true; ov.set(id,Object.assign({},next,{x:true})); render(); showToast("저장하지 못했어요. 잠시 후 다시 해보세요.",null);
  });
});
$("q").addEventListener("input",e=>{ S.q=e.target.value; render(); });
(function(){ const d=new Date(); $("eyebrow").hidden=true; paint($("home"),"x"); })();
render();

(async()=>{
  if(STATIC){ readOnly=true; readOnlyWhy=""; ready=true; render(); return; }
  try{
    if(!(window.claude && window.claude.use)){ readOnly=true; readOnlyWhy="미리보기 화면이라 편집은 저장되지 않아요."; return; }
    const user=await window.claude.use("user");
    const can = user ? await user.can("data.write") : null;
    try{ dl=await window.claude.use("downloads"); }catch(e){ dl=null; }
    db=await window.claude.use("db");
    if(!db){ readOnly=true; readOnlyWhy="로그인한 화면에서 열면 분류를 고치고 저장할 수 있어요."; return; }
    if(can===false){ readOnly=true; readOnlyWhy="보기 전용이에요. 편집 권한을 받으면 분류를 바꿀 수 있어요."; }
    db.collection("edits").onSnapshot(snap=>{
      ov.clear();
      snap.docs.forEach(d=>{ const v=d.data()||{}; if(v.manual && !byId.has(d.id) && v.n && DONGS.includes(v.dg)){ const nr={id:d.id,n:String(v.n),a:String(v.a||""),dg:v.dg,m:0,d:"",s:CATKEYS.includes(v.s)?v.s:"기타",g:v.g?1:0,f:"",manual:1}; DATA.push(nr); byId.set(nr.id,nr); } if(byId.has(d.id)) ov.set(d.id,{s:v.s,star:!!v.star,x:!!v.x,h:(v.h===undefined?undefined:!!v.h),c:(v.c===undefined?undefined:!!v.c)}); });
      render();
    },()=>{ showToast("저장된 분류를 불러오지 못했어요.", null); });
  }catch(e){ /* page still works read-only */ }
  finally{ ready=true; render(); }
})();
