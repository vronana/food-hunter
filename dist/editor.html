<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>오늘 뭐먹지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* Layout: quiet Apple-style screens in warm neutrals. Home = date, big question, search, white category cards. List = grouped inset lists by neighborhood. One accent color, one typeface (Jua). One light theme on purpose. */
:root{
  --bg:#f7f5f2; --paper:#ffffff; --ink:#2b2622; --muted:#8b8279; --line:#eee9e3; --fill:#efebe5;
  --accent:#d9622b; --accent-soft:#fdeee4; --accent-fg:#ffffff; --danger:#c8403a;
  --shadow:0 1px 2px rgba(70,50,30,.05),0 6px 20px rgba(70,50,30,.06);
  --font:"Jua","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-synthesis:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,b,strong{font-weight:400}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
button,select,input{font:inherit;font-weight:400}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;padding:8px 16px;min-height:52px;background:rgba(247,245,242,.85);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);display:flex;align-items:center;gap:10px}
.back{border:0;background:none;color:var(--accent);font-size:1.05rem;cursor:pointer;padding:6px 6px 6px 0;display:flex;align-items:center;gap:4px}
.back::before{content:"";width:9px;height:9px;border-left:2.2px solid currentColor;border-bottom:2.2px solid currentColor;transform:rotate(45deg);margin-right:3px}
.spacer{flex:1}
.save{font-size:.85rem;color:var(--muted);white-space:nowrap}
.save.err{color:var(--danger)}
.editbtn{border:0;border-radius:999px;background:var(--fill);color:var(--ink);font-size:.92rem;padding:7px 15px;cursor:pointer}
.editbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tbtn{border:0;background:none;color:var(--muted);display:inline-flex;align-items:center;gap:4px;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:.9rem}
.tbtn:hover{background:var(--fill);color:var(--ink)}
.tbtn .ic{--s:22px}
.ic{display:inline-flex;width:var(--s,44px);height:var(--s,44px);flex:none}
.ic svg{width:100%;height:100%}
.ic.line{color:var(--muted)}
.lhead{display:flex;align-items:center;gap:12px}

.hero{padding-block:26px 4px}
.eyebrow{margin:0 0 8px;color:var(--muted);font-size:1rem}
h1{font-size:2.6rem;line-height:1.18;letter-spacing:-.01em;margin:0;text-wrap:balance}
.mark{color:var(--accent)}
.sub{margin:10px 0 0;color:var(--muted);font-size:1rem}
.search{position:relative;margin-block:22px 4px}
.search input{width:100%;border:0;background:var(--fill);color:var(--ink);font-size:1.05rem;padding:14px 16px 14px 44px;border-radius:14px}
.search input::placeholder{color:var(--muted)}
.search::before{content:"";position:absolute;left:17px;top:50%;width:11px;height:11px;border:2px solid var(--muted);border-radius:50%;transform:translateY(-62%)}
.search::after{content:"";position:absolute;left:27px;top:calc(50% + 5px);width:7px;height:2px;background:var(--muted);transform:rotate(45deg);border-radius:2px}

.lab{margin:34px 0 12px;padding-inline:4px;font-size:.95rem;color:var(--muted)}
.lab:empty{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cc{border:0;text-align:left;background:var(--paper);color:var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:20px 18px 18px;cursor:pointer;display:flex;flex-direction:column;gap:2px;transition:transform .15s}
.cc:hover{transform:translateY(-2px)}
.cc:active{transform:scale(.98)}
.cc .ic{margin-bottom:10px}
.cn{font-size:1.4rem;line-height:1.25}
.cm{font-size:.95rem;color:var(--muted)}
.sc{border:0;text-align:left;background:var(--paper);color:var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.trashlink{margin-top:26px;width:100%}
.sc .ic{grid-row:1/3}
.sc .scl{font-size:1.05rem;align-self:end}
.sc .scn{align-self:start;color:var(--muted);font-size:.95rem}
.todo{margin-top:30px;border-radius:20px;background:var(--paper);box-shadow:var(--shadow);padding:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.todo p{margin:0;font-size:1.1rem}
.todo small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.todo button{border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent);padding:9px 18px;cursor:pointer}
.link{margin-top:24px;border:0;background:none;color:var(--muted);font-size:.92rem;cursor:pointer;padding:6px 4px}
.link:hover{color:var(--ink)}

.lh{padding-block:20px 0}
.lh h1{font-size:2.4rem}
.lh .sub{margin-top:6px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-block:16px 2px}
.selw{position:relative;display:inline-block}
.selw::after{content:"";position:absolute;right:13px;top:50%;width:5px;height:5px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;color:var(--muted)}
.pill{appearance:none;-webkit-appearance:none;border:0;background:var(--fill);color:var(--ink);font-size:.95rem;padding:8px 32px 8px 15px;border-radius:999px;cursor:pointer}
button.pill{padding:8px 15px}
button.pill[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.banner{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--fill);color:var(--muted);font-size:.95rem}
.notice{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--fill);color:var(--muted);font-size:.95rem}

.cap{margin:26px 0 8px;padding-inline:6px;display:flex;align-items:baseline;gap:8px;color:var(--muted);font-size:.95rem}
.cap b{color:var(--ink)}
.card{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"star info ctl" ". panel panel";gap:4px 8px;align-items:center;padding:13px 14px 13px 6px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.star{grid-area:star;font-size:1.3rem;line-height:1;border:0;background:none;color:#ddd6cd;cursor:pointer;padding:8px;border-radius:8px}
.star[aria-pressed="true"]{color:var(--accent)}
.star:hover{color:var(--accent)}
.star:disabled{cursor:default}
.info{grid-area:info;min-width:0}
.nm{font-size:1.08rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px;overflow-wrap:anywhere}
.badge{font-size:.75rem;color:var(--accent);background:var(--accent-soft);padding:1px 9px;border-radius:999px;white-space:nowrap}
.tag{font-size:.75rem;color:var(--muted);background:var(--fill);padding:1px 9px;border-radius:999px;white-space:nowrap}
.meta,.menu{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.info.tap{cursor:pointer;border-radius:10px}
.item.open{background:var(--fill)}
.panel{grid-area:panel;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 0 4px}
.pbtn{font-size:.92rem;border:0;border-radius:999px;background:var(--paper);color:var(--ink);padding:7px 15px;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.pbtn.main{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.pbtn.del{color:var(--danger);margin-left:0}
.pbtn.del.armed{background:var(--danger);color:#fff}
.pbtn:disabled{opacity:.5;cursor:default}
.ctl{grid-area:ctl;display:flex;align-items:center;gap:6px}
.cat{appearance:none;-webkit-appearance:none;font-size:.92rem;border:0;background:var(--fill);color:var(--ink);padding:7px 28px 7px 13px;border-radius:999px;cursor:pointer;max-width:9.5em}
.cat:disabled{cursor:default;opacity:.7}
.ctl .selw::after{right:11px}
.map{font-size:.88rem;color:var(--accent);text-decoration:none;padding:6px;white-space:nowrap}
.map:hover{text-decoration:underline}
.del,.restore{font-size:.88rem;border:0;background:none;cursor:pointer;padding:6px;border-radius:8px;white-space:nowrap}
.del{color:var(--danger);margin-left:8px}
.del.armed{background:var(--danger);color:#fff;padding-inline:10px}
.restore{color:var(--accent)}
.del:disabled,.restore:disabled{opacity:.5;cursor:default}
.backupw{margin-top:34px;text-align:center}
.backup{border:0;background:none;color:var(--muted);font-size:.9rem;padding:8px 14px;border-radius:999px;cursor:pointer}
.backup:hover{background:var(--fill);color:var(--ink)}
.badge.chain{color:#4a63c9;background:#e8edff}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:#fff;padding:11px 14px 11px 18px;border-radius:999px;box-shadow:0 8px 28px rgba(43,38,34,.25);display:flex;gap:14px;align-items:center;font-size:.95rem;max-width:calc(100vw - 32px)}
.toast button{color:#fff;background:var(--accent);border:0;border-radius:999px;padding:5px 13px;cursor:pointer}
footer{margin-top:44px;color:var(--muted);font-size:.85rem;max-width:60ch}
@media (max-width:560px){
  h1{font-size:2.15rem}
  .lh h1{font-size:2rem}
}
@media (prefers-reduced-motion:reduce){.cc{transition:none}}
</style>

</head>

    </div>
    <p class="banner" id="banner" hidden></p>
    <p class="notice" id="notice" hidden></p>
    <div id="listbody"></div>
  </section>
</div>

<div class="toast" id="toast" hidden role="status"><span id="toastmsg"></span><button type="button" id="undo">되돌리기</button></div>

    if(!it.h && it.s==="기타") sel.value=""; else if(it.s!=="기타") sel.value=it.s; else sel.value="";
    sel.disabled=lock; paint(sel,it.s);
    sel.addEventListener("change",()=>{ if(!sel.value) return; setCat(r.id,{s:sel.value,star:it.star,x:false,h:false},it.h?"unhold":"move"); });
    const hb=h("button",{className:"pbtn",type:"button",text:it.h?"보류 풀기":"보류"}); hb.disabled=lock;
    hb.addEventListener("click",()=>setCat(r.id,{s:it.s,star:it.star,x:false,h:!it.h},it.h?"restore":"hold"));
    const delBtn=h("button",{className:"pbtn del",type:"button","aria-label":r.n+" 삭제",text:"삭제"}); delBtn.disabled=lock;
    let armed=false, armTimer=null;
    delBtn.addEventListener("click",()=>{
      if(!armed){
        armed=true; delBtn.textContent="삭제할까요?"; delBtn.classList.add("armed");
        armTimer=setTimeout(()=>{ armed=false; delBtn.textContent="삭제"; delBtn.classList.remove("armed"); },3000);
        return;
      }
      clearTimeout(armTimer); setCat(r.id,{s:it.s,star:it.star,x:true,h:it.h},"del");
    });
    const cb=h("button",{className:"pbtn",type:"button",text:it.c?"체인 해제":"체인 표시"}); cb.disabled=lock;
    cb.addEventListener("click",()=>setCat(r.id,{c:!it.c},"chain"));
    p.append(h("span",{className:"selw"},sel),hb,cb,delBtn);
  }
  el.append(p);
  return el;
}
function groups(items,o){
  const frag=document.createDocumentFragment();
  const dgs=[...DONGS, ...new Set(items.map(i=>i.r.dg).filter(d=>!DONGS.includes(d)))];
  dgs.forEach(d=>{
    const g=items.filter(i=>i.r.dg===d); if(!g.length) return;
    const cap=h("div",{className:"cap"},h("b",{text:d}),h("span",{text:g.length+"곳"}));
    const card=h("div",{className:"card"}); g.forEach(i=>card.append(row(i,o)));
    frag.append(cap,card);
  });
  return frag;
}

/* ---------- screens ---------- */
function renderHome(all){
  const vis=all.filter(i=>!i.x && !i.h);
  $("sub").textContent="영업 5년 이상 · 50㎡ 이상 · "+vis.length+"곳";
  const body=$("homebody"); const frag=document.createDocumentFragment();
  const t=S.q.trim().toLowerCase();
  if(t){
    const hits=vis.filter(i=>(i.r.n+" "+i.r.a+" "+i.r.dg+" "+i.r.f).toLowerCase().includes(t)).sort(SORTS.name);
    frag.append(h("p",{className:"lab",text:hits.length?("검색 결과 "+hits.length+"곳"):""}));
    if(!hits.length) frag.append(h("p",{className:"empty",text:"찾는 가게가 없어요. 다른 이름이나 동네로 검색해 보세요."}));
    else frag.append(groups(hits,{tag:true,edit:false}));
    body.replaceChildren(frag); return;
  }
  const count=k=>vis.filter(i=>i.s===k).length;
  const card=k=>{
    const b=h("button",{className:"cc",type:"button"},icon(k,48),h("span",{className:"cn",text:label(k)}),h("span",{className:"cm",text:count(k)+"곳"}));
    paint(b,k); b.addEventListener("click",()=>go("list",k)); return b;
  };
  frag.append(h("p",{className:"lab",text:"한식"}));
  const g1=h("div",{className:"grid"}); ["육류","탕류","밥류","면류"].forEach(k=>g1.append(card(k))); frag.append(g1);
  frag.append(h("p",{className:"lab",text:"다른 음식"}));
  const g2=h("div",{className:"grid"}); ["중식","일식","양식","세계음식"].forEach(k=>g2.append(card(k))); frag.append(g2);
  frag.append(h("p",{className:"lab",text:"바로가기"}));
  const g3=h("div",{className:"grid"});
  
  const holdN=all.filter(i=>!i.x && i.h).length;
  [["g","모범음식점",vis.filter(i=>i.r.g).length],["fav","즐겨찾기",all.filter(i=>!i.x && i.star).length],["chain","체인점",vis.filter(i=>i.c).length],["hold","보류함",holdN]].filter(x=>STATIC ? (x[0]!=="hold" && (x[0]!=="fav"||x[2]>0)) : true).forEach(([k,t2,n])=>{
    const b=h("button",{className:"sc",type:"button"},icon(k,34),h("span",{className:"scl",text:t2}),h("span",{className:"scn",text:n+"곳"}));
    paint(b,k); b.addEventListener("click",()=>go("list",k)); g3.append(b);
  });
  frag.append(g3);
  if(!STATIC && dl){
    const bk=h("button",{className:"backup",type:"button",text:"내 컴퓨터에 백업"});
    bk.addEventListener("click",async()=>{
      const out={}; ov.forEach((v,k)=>{ const o={s:v.s,star:!!v.star,x:!!v.x}; if(v.h!==undefined) o.h=!!v.h; out[k]=o; });
      const d=new Date(), ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
      try{ await dl.save({filename:"food-hunter-edits-"+ymd+".json",data:JSON.stringify(out,null,1)}); showToast("백업 파일을 저장했어요 ("+Object.keys(out).length+"건)",null); }
      catch(e){ if(!e||e.code!=="declined") showToast("백업하지 못했어요. 잠시 후 다시 해보세요.",null); }
    });
    frag.append(h("div",{className:"backupw"},bk));
  }
  body.replaceChildren(frag);
}

function renderList(all){
  const key=S.key;
  let base=itemsFor(key,all);
  const mixed=!!MIXED[key];
  const title=mixed?MIXED[key][0]:label(key);
  const c=CATS.find(x=>x.k===key);
  $("lt").textContent=title;
  paint($("listview"),key);
  $("lic").replaceChildren(icon(key,52));
  if(S.onlyG && key!=="g" && key!=="trash") base=base.filter(i=>i.r.g);
  if(S.onlyC && key!=="chain" && key!=="trash") base=base.filter(i=>i.c);
  const dsel=$("dongsel");
  dsel.replaceChildren(h("option",{value:"all",text:"모든 동네"}), ...DONGS.map(d=>h("option",{value:d,text:d+" "+base.filter(i=>i.r.dg===d).length})));
  dsel.value=S.dong;
  const shown=base.filter(i=>S.dong==="all"||i.r.dg===S.dong).sort((a,b)=>(b.r.g-a.r.g)||SORTS[S.sort](a,b));
  $("ls").textContent=shown.length+"곳"+(mixed?(" · "+MIXED[key][1]):(c&&c.g?" · "+c.g:""));
  $("gbtn").hidden=(key==="g"||key==="trash");
  $("gbtn").setAttribute("aria-pressed",String(S.onlyG));
  $("cbtn").hidden=(key==="chain"||key==="trash"); $("cbtn").setAttribute("aria-pressed",String(S.onlyC));
  $("banner").hidden=true;
  const nt=$("notice"); nt.textContent=readOnly?(readOnlyWhy||(STATIC?"":"보기 전용이에요.")):""; nt.hidden=!(readOnly && nt.textContent);
  const frag=document.createDocumentFragment();
  if(!shown.length) frag.append(h("p",{className:"empty",text:key==="trash"?"삭제한 가게가 없어요.":key==="hold"?"보류한 가게가 없어요.":key==="fav"?"별표를 누른 가게가 아직 없어요.":"조건에 맞는 가게가 없어요."}));
  else {
    const favs=(key==="fav"||key==="trash"||key==="hold")?[]:shown.filter(i=>i.star);
    if(favs.length){
      frag.append(h("div",{className:"cap"},h("b",{text:"★ 즐겨찾기"}),h("span",{text:favs.length+"곳"})));
      const fc=h("div",{className:"card"}); favs.forEach(i=>fc.append(row(i,{tag:mixed}))); frag.append(fc);
    }
    frag.append(groups(shown.filter(i=>!favs.includes(i)),{tag:mixed}));
  }
  if(key==="hold"){
    const tn=all.filter(i=>i.x).length;
    const tb=h("button",{className:"sc trashlink",type:"button"},icon("trash",30),h("span",{className:"scl",text:"삭제함"}),h("span",{className:"scn",text:tn+"곳"}));
    tb.addEventListener("click",()=>go("list","trash")); frag.append(tb);
  }
  $("listbody").replaceChildren(frag);
}

function paintTop(tc){
  $("back").hidden=S.view!=="list";
  const tb=$("trashbtn");
  tb.hidden=true;
  $("trashn").textContent=tc>0?tc:"";
}
function render(){
  const y=window.scrollY;
  const all=allItems();
  paintTop(all.filter(i=>i.x).length);
  if(S.view==="home") renderHome(all); else renderList(all);
  paintSave();
  if(window.scrollY!==y) window.scrollTo(0,y);
}
function go(view,key){
  S.view=view; S.key=key||null; S.dong="all"; S.onlyG=false; S.onlyC=false; S.open=null;
  $("home").hidden=view!=="home"; $("listview").hidden=view!=="list";
  render(); window.scrollTo(0,0);
}

/* ---------- toast ---------- */
let toastTimer=null, undoFn=null;
function showToast(msg, undo){
  $("toastmsg").textContent=msg; undoFn=undo; $("undo").hidden=!undo; $("toast").hidden=false;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{$("toast").hidden=true;},6500);
}
$("undo").addEventListener("click",()=>{ const f=undoFn; $("toast").hidden=true; undoFn=null; if(f) f(); });

/* ---------- wiring ---------- */
$("trashic").innerHTML=TRASH_SVG;
$("trashbtn").addEventListener("click",()=>go("list","trash"));
$("back").addEventListener("click",()=>{ if(S.view==="list" && S.key==="trash") go("list","hold"); else go("home"); });

$("dongsel").addEventListener("change",e=>{ S.dong=e.target.value; render(); });
$("sortsel").addEventListener("change",e=>{ S.sort=e.target.value; render(); });
$("gbtn").addEventListener("click",()=>{ S.onlyG=!S.onlyG; render(); });
$("cbtn").addEventListener("click",()=>{ S.onlyC=!S.onlyC; render(); });
if(STATIC) STARS_BAKED.forEach(id=>{ if(byId.has(id)) ov.set(id,{s:byId.get(id).s,star:true,x:false,h:false}); });
(function(){ const d=new Date(); $("eyebrow").hidden=true; paint($("home"),"x"); })();
render();

(async()=>{
  if(STATIC){ readOnly=true; readOnlyWhy=""; ready=true; render(); return; }
  try{
    if(!(window.claude && window.claude.use)){ readOnly=true; readOnlyWhy="미리보기 화면이라 편집은 저장되지 않아요."; return; }
    const user=await window.claude.use("user");
    const can = user ? await user.can("data.write") : null;
    try{ dl=await window.claude.use("downloads"); }catch(e){ dl=null; }
    db=await window.claude.use("db");
    if(!db){ readOnly=true; readOnlyWhy="로그인한 화면에서 열면 분류를 고치고 저장할 수 있어요."; return; }
    if(can===false){ readOnly=true; readOnlyWhy="보기 전용이에요. 편집 권한을 받으면 분류를 바꿀 수 있어요."; }
    db.collection("edits").onSnapshot(snap=>{
      ov.clear();
      snap.docs.forEach(d=>{ const v=d.data()||{}; if(byId.has(d.id)) ov.set(d.id,{s:v.s,star:!!v.star,x:!!v.x,h:(v.h===undefined?undefined:!!v.h),c:(v.c===undefined?undefined:!!v.c)}); });
      render();
    },()=>{ showToast("저장된 분류를 불러오지 못했어요.", null); });
  }catch(e){ /* page still works read-only */ }
  finally{ ready=true; render(); }
})();
</script>
